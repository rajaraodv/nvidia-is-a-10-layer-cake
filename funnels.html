<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NVIDIA Developer Journeys — overview + fine-grained per-persona journeys</title>
<style>
  :root{
    --green:#76b900;--ink:#141414;--paper:#fff;--line:#e7e7e2;--muted:#2f2f2a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{display:flex;flex-direction:column;overflow:hidden;}
  header{flex:0 0 auto;border-bottom:1px solid var(--line);padding:12px 22px 11px;}
  .titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  h1{font-family:var(--serif);font-weight:600;font-size:46px;margin:0;letter-spacing:-.01em;}
  h1 .accent{color:var(--green);}
  .sub{font-size:25px;color:var(--muted);max-width:980px;}
  #backBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 14px;font-size:22px;font-weight:600;cursor:pointer;font-family:var(--sans);color:#1f1f1f;}
  #backBtn:hover{background:#f4f4f0;}
  .crumb{font-size:25px;color:var(--muted);}
  .crumb b{color:var(--ink);}

  .stage{position:relative;flex:1 1 auto;overflow:hidden;background:#fcfcfa;cursor:grab;}
  .stage.grabbing{cursor:grabbing;}
  svg{display:block;width:100%;height:100%;touch-action:none;}

  .zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:5;}
  .zoom button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:19px;cursor:pointer;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);font-family:var(--sans);}
  .zoom button:hover{background:#f4f4f0;}
  .zoom button.fit{font-size:11px;font-weight:600;}
  .hint{position:absolute;left:16px;bottom:16px;font-size:20px;color:#2f2f2a;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:7px;padding:6px 11px;z-index:5;}

  text{font-family:var(--sans);}
  .nodeName{font-size:24px;fill:var(--ink);font-weight:600;}
  .nodeSub{font-size:20px;fill:var(--muted);}
  .nodeBadge{font-size:22px;font-weight:700;}
  .pName{font-size:26px;font-weight:700;cursor:pointer;}
  .pIntent{font-size:20px;cursor:pointer;}
  .stageHdr{font-size:28px;fill:#1f1f1f;letter-spacing:.1em;font-weight:700;text-transform:uppercase;}
  .stageHdrHub{fill:#4f6f12;}
  .portalName{font-size:25px;fill:#2c4010;font-weight:700;}
  /* focus view */
  .fTitle{font-family:var(--serif);font-size:42px;font-weight:600;}
  .fIntent{font-size:26px;fill:var(--muted);}
  .fPhase{font-size:20px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;}
  .fStep{font-size:26px;font-weight:600;fill:var(--ink);}
  .fDetail{font-size:23px;fill:#33332e;}
  .fFric{font-size:22px;fill:#9a5a00;font-weight:600;}
  .fHint{font-size:23px;fill:#33332e;font-style:italic;}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <button id="backBtn">← All personas</button>
    <h1 id="h1">NVIDIA Developer <span class="accent">Journeys</span></h1>
    <div class="sub" id="subline">Overview of every persona. <b>Click a persona</b> to open its full, step-by-step journey on its own.</div>
  </div>
</header>

<div class="stage" id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <g id="viewport">
      <g id="gA"></g><g id="gB"></g><g id="gC"></g><g id="gD"></g>
    </g>
  </svg>
  <div class="zoom">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zfit" class="fit" title="Fit to screen">FIT</button>
  </div>
  <div class="hint" id="hint">Click a persona to open its journey · drag to pan · scroll to zoom</div>
</div>

<script>
/* ============================================================================

   - Focus (click a persona): ONLY that journey, step by step, with branches
     and friction. All other journeys are removed.
   ============================================================================ */
const PERSONAS = [

  {id:'data',    name:'Data Scientist',        intent:'accelerate data & analytics',           layer:'04', color:'#0e8a8a', order:2},
  {id:'researcher',name:'AI Researcher',       intent:'train a model from scratch',            layer:'05', color:'#0071c5', order:3},
  {id:'hpc',     name:'CUDA / HPC Developer',  intent:'hand-optimize GPU compute',             layer:'03', color:'#3b4ea0', order:4},

  {id:'robotics',name:'Robotics / Physical-AI',intent:'build & deploy a robot',                layer:'09', color:'#e2553a', order:6},
  {id:'mlops',   name:'MLOps / Platform Eng',  intent:'self-host & operate inference',         layer:'07', color:'#ee7d11', order:7},
  {id:'student', name:'Student / Learner',     intent:'learn & get certified',                 layer:'10', color:'#c79a00', order:8},

const CH={ google:{name:'Google search',sub:'“open-source LLM”'}, chatgpt:{name:'ChatGPT / LLM',sub:'“which model?”'},
  yt:{name:'YouTube',sub:'tutorials · reviews'}, social:{name:'X (Twitter)',sub:'model drops · demos'},

/* The FULL Layer-10 portal directory (Programs, Portals & Community) from the 10-layer cake,
   grouped by its five sub-groups (+ build.nvidia.com and retail as the other real front doors). */
const L10GROUPS = [
  {cat:'Discover & Read', portals:[
    ['developer','developer.nvidia.com'],['docs','docs.nvidia.com'],['blog','Technical Blog'],
    ['gtc','GTC Conference'],['ondemand','NVIDIA On-Demand'],['research','NVIDIA Research']]},
  {cat:'Learn & Certify', portals:[
    ['learn','learn.nvidia.com (DLI)'],['launchpad','NVIDIA LaunchPad'],['cert','NVIDIA Certification']]},
  {cat:'Build with Tools', portals:[
    ['build','build.nvidia.com'],['github','GitHub · NVIDIA'],['hf','Hugging Face'],
    ['ngc','NGC catalog'],['workbench','AI Workbench']]},
  {cat:'Connect & Ask', portals:[
    ['devprog','Developer Program'],['discord','Discord'],['forums','Developer Forums']]},
  {cat:'Partner & Fund', portals:[
    ['aie','NVIDIA AI Enterprise'],['inception','Inception (startups)'],
    ['exemplar','Exemplar Cloud'],['coalition','Nemotron Coalition']]},
  {cat:'Shop & Buy', portals:[
    ['retail','nvidia.com · retail']]},
];
const PORTAL_NAME={}; L10GROUPS.forEach(g=>g.portals.forEach(([id,n])=>PORTAL_NAME[id]=n));
const PORTAL_CAT={}; L10GROUPS.forEach(g=>g.portals.forEach(([id])=>PORTAL_CAT[id]=g.cat));

// each persona's PRIMARY landing portal + the other Layer-10 portals they touch on the journey
const PRIMARY={ app:'build', applied:'build', data:'developer', researcher:'developer', hpc:'developer',
  game:'developer', robotics:'developer', mlops:'ngc', student:'learn', laptop:'retail', dc:'retail' };
const SECONDARY={
  app:['blog','github','devprog','discord','aie','inception','coalition','docs'],
  applied:['hf','github','workbench','aie','coalition','blog'],
  data:['docs','ngc','workbench','github'],
  researcher:['github','hf','ngc','research','ondemand'],
  hpc:['docs','github','forums'],
  game:['docs','forums','discord'],
  robotics:['github','gtc','aie'],
  mlops:['docs','gtc','launchpad','exemplar','aie'],
  student:['ondemand','cert','discord','devprog'],
  laptop:['docs'],
  dc:['gtc','launchpad','exemplar'] };
function portalsOf(pid){return [PRIMARY[pid], ...SECONDARY[pid]];}

/* fine-grained journeys. step: {phase,title,detail, ch?/portal?/goal?/friction?, branch?[{title,detail}]} */
const J = {
 app:{portal:'build', goal:'App in production', steps:[
   {phase:'Trigger', title:'Needs an LLM for a feature', detail:'A product needs summarize / chat / extract. Build vs buy a model.'},
   {phase:'Looking', title:'Googles “best open-source LLM”', detail:'Compares cost, license, context length.', ch:'google'},
   {phase:'Looking', title:'Asks ChatGPT which model to use', detail:'Gets pointed toward open models incl. Nemotron.', ch:'chatgpt'},
   {phase:'Looking', title:'Sees model drops on X', detail:'NVIDIA AI accounts post launches & demos on X / Twitter.', ch:'social'},
   {phase:'Looking', title:'Catches a GTC keynote', detail:'New models get announced at GTC.', ch:'gtc'},
   {phase:'Discover', title:'Zeroes in on Nemotron', detail:'Open weights, 1M context, runs on NVIDIA.'},
   {phase:'Land', title:'Lands on build.nvidia.com', detail:'Free, in-browser, OpenAI-compatible API.', portal:true},
   {phase:'Try', title:'Three ways to try it', branch:[
       {title:'Live playground', detail:'Paste a prompt, see it work — zero setup.'},
       {title:'Hosted API key', detail:'Call it from code on the free tier.'},
       {title:'Self-host with NIM', detail:'Spin up your own container, OpenAI-compatible.'}]},
   {phase:'Build', title:'Wires the model into the app', detail:'Swaps the endpoint, ships a prototype.'},
   {phase:'Hurdle', title:'Hits the free-tier 40 RPM wall', detail:'Agentic loops throttle → must pick a path forward.', friction:true},
   {phase:'Decide', title:'Hosted cloud · self-host · license', detail:'Production = AWS Bedrock, NIM, or AI Enterprise.'},
   {phase:'Goal', title:'App in production', detail:'Feature ships, running on Nemotron.', goal:true} ]},

 applied:{portal:'build', goal:'Tuned model shipped', steps:[
   {phase:'Trigger', title:'Off-the-shelf quality/cost not enough', detail:'Needs a model tuned to the domain.'},
   {phase:'Looking', title:'Reads model leaderboards on HF', detail:'Shortlists candidates by quality vs size.', ch:'arxiv'},
   {phase:'Looking', title:'Googles “fine-tune LLM domain”', detail:'Looks for a tuning recipe.', ch:'google'},
   {phase:'Looking', title:'Follows fine-tuning threads on X', detail:'Recipes & benchmarks shared on X / Twitter.', ch:'social'},
   {phase:'Looking', title:'Sees a GTC fine-tuning talk', detail:'NeMo customization demos at GTC.', ch:'gtc'},
   {phase:'Discover', title:'Finds Nemotron / Llama-Nemotron', detail:'Tuned open base models from NVIDIA.'},
   {phase:'Land', title:'build.nvidia.com to benchmark', detail:'Side-by-side compare before committing.', portal:true},
   {phase:'Try', title:'Evaluate candidates', branch:[
       {title:'Compare in playground', detail:'Same prompts across models.'},
       {title:'Hosted API for eval set', detail:'Batch-score on real data.'}]},
   {phase:'Build', title:'Fine-tunes with NeMo (LoRA)', detail:'Customizes the base model to the task.'},
   {phase:'Hurdle', title:'Needs GPUs for the tuning run', detail:'Local card too small → cloud or DGX.', friction:true},
   {phase:'Goal', title:'Tuned model shipped', detail:'Domain model in production.', goal:true} ]},

 data:{portal:'developer', goal:'10× faster pipeline', steps:[
   {phase:'Trigger', title:'Pandas / Spark job too slow', detail:'Hours-long ETL blocking the team.'},
   {phase:'Looking', title:'Googles “speed up pandas”', detail:'Finds GPU dataframe options.', ch:'google'},
   {phase:'Looking', title:'Sees a RAPIDS talk on YouTube', detail:'Drop-in cuDF speedups.', ch:'yt'},
   {phase:'Looking', title:'Sees RAPIDS demos on X', detail:'GPU data-science wins shared on X / Twitter.', ch:'social'},
   {phase:'Discover', title:'Learns about GPU dataframes', detail:'cuDF / cuML mirror the pandas API.'},
   {phase:'Land', title:'developer.nvidia.com', detail:'Docs + install for RAPIDS.', portal:true},
   {phase:'Try', title:'Installs RAPIDS / cuDF', detail:'conda / pip / container.'},
   {phase:'Build', title:'Swaps pandas → cuDF', detail:'Same code, GPU under it.'},
   {phase:'Hurdle', title:'No local GPU to run it', detail:'Needs a cloud GPU or workstation.', friction:true},
   {phase:'Goal', title:'10× faster pipeline', detail:'ETL drops from hours to minutes.', goal:true} ]},

 researcher:{portal:'developer', goal:'Model trained & published', steps:[
   {phase:'Trigger', title:'Wants to train a new model', detail:'New architecture / dataset to prove out.'},
   {phase:'Looking', title:'Reads arXiv, grabs weights on HF', detail:'Surveys prior art + baselines.', ch:'arxiv'},
   {phase:'Looking', title:'Follows researchers on X', detail:'Results & weights break on X / Twitter first.', ch:'social'},
   {phase:'Looking', title:'Watches GTC research talks', detail:'Deep technical sessions at GTC.', ch:'gtc'},
   {phase:'Discover', title:'Sees NeMo / Megatron referenced', detail:'Standard tooling for scale training.'},
   {phase:'Land', title:'developer.nvidia.com / NGC', detail:'Pulls the NeMo container.', portal:true},
   {phase:'Try', title:'Runs a small training job', detail:'Validates the recipe on a few GPUs.'},
   {phase:'Build', title:'Scales with Megatron on DGX', detail:'Tensor / pipeline parallelism.'},
   {phase:'Hurdle', title:'Multi-GPU cluster cost & setup', detail:'Needs DGX / cloud capacity + budget.', friction:true},
   {phase:'Goal', title:'Model trained & published', detail:'Weights + paper released.', goal:true} ]},

 hpc:{portal:'developer', goal:'Accelerated app shipped', steps:[
   {phase:'Trigger', title:'A compute kernel is the bottleneck', detail:'CPU code too slow for the workload.'},
   {phase:'Looking', title:'Googles + reads HPC forums', detail:'GPU offload is the path.', ch:'google'},
   {phase:'Looking', title:'Peers point to CUDA', detail:'Community confirms the approach.', ch:'community'},
   {phase:'Discover', title:'CUDA is the platform', detail:'Plus cuBLAS / CUTLASS for math.'},
   {phase:'Land', title:'developer.nvidia.com (CUDA docs)', detail:'Toolkit + samples + docs.', portal:true},
   {phase:'Try', title:'Installs the CUDA Toolkit', detail:'Compiles a first kernel.'},
   {phase:'Build', title:'Writes kernels; uses cuBLAS', detail:'Offloads the hot path to GPU.'},
   {phase:'Hurdle', title:'Profiling to find the bottleneck', detail:'Nsight to chase the last %.', friction:true},
   {phase:'Goal', title:'Accelerated app shipped', detail:'Order-of-magnitude speedup.', goal:true} ]},

 game:{portal:'developer', goal:'Game ships with DLSS', steps:[
   {phase:'Trigger', title:'Frame rate too low at high res', detail:'Need more FPS without losing fidelity.'},
   {phase:'Looking', title:'GDC talks + gamedev forums', detail:'How studios add DLSS.', ch:'community'},
   {phase:'Looking', title:'YouTube DLSS demos', detail:'Sees the before/after.', ch:'yt'},
   {phase:'Discover', title:'DLSS reconstructs frames', detail:'Render low, upscale with AI.'},
   {phase:'Land', title:'developer.nvidia.com (RTX SDK)', detail:'Streamline + DLSS SDK downloads.', portal:true},
   {phase:'Try', title:'Downloads Streamline + DLSS', detail:'One plugin layer for the engine.'},
   {phase:'Build', title:'Integrates into the engine', detail:'Hooks DLSS / Reflex into the pipeline.'},
   {phase:'Hurdle', title:'Engine integration & cert', detail:'Validation + per-engine quirks.', friction:true},
   {phase:'Goal', title:'Game ships with DLSS', detail:'Higher FPS at launch.', goal:true} ]},

 robotics:{portal:'developer', goal:'Robot deployed', steps:[
   {phase:'Trigger', title:'Train a robot policy safely', detail:'Can’t train on real hardware first.'},
   {phase:'Looking', title:'GTC robotics keynote', detail:'Sees Isaac / GR00T demos.', ch:'gtc'},
   {phase:'Looking', title:'Partner / SI intro', detail:'Guided into the platform.', ch:'yt'},
   {phase:'Discover', title:'Isaac + Omniverse for sim', detail:'Photoreal sim + RL training.'},
   {phase:'Land', title:'developer.nvidia.com (Isaac)', detail:'SDKs + Omniverse downloads.', portal:true},
   {phase:'Try', title:'Simulates in Omniverse', detail:'Builds the scene + sensors.'},
   {phase:'Build', title:'Trains in Isaac Lab → Jetson', detail:'RL policy, deploy to the edge module.'},
   {phase:'Hurdle', title:'Sim-to-real gap', detail:'Policy must transfer to hardware.', friction:true},
   {phase:'Goal', title:'Robot deployed', detail:'Running in the field.', goal:true} ]},

 mlops:{portal:'ngc', goal:'Inference at scale', steps:[
   {phase:'Trigger', title:'Serve models org-wide', detail:'Many teams need reliable inference.'},
   {phase:'Looking', title:'Vendor eval + ref architectures', detail:'Compares serving stacks.', ch:'gtc'},
   {phase:'Looking', title:'Googles “NIM on kubernetes”', detail:'Looks for a standard.', ch:'google'},
   {phase:'Discover', title:'NIM / Triton standardize serving', detail:'Containerized, OpenAI-compatible.'},
   {phase:'Land', title:'NGC catalog', detail:'Pulls NIM / Helm charts.', portal:true},
   {phase:'Try', title:'Runs a NIM container', detail:'OpenAI-compatible endpoint up.'},
   {phase:'Build', title:'Deploys on k8s (GPU Operator)', detail:'Schedulable GPUs, autoscale.'},
   {phase:'Hurdle', title:'Licensing: community vs NVAIE', detail:'Speech / specialized NIMs need entitlement.', friction:true},
   {phase:'Goal', title:'Inference at scale', detail:'Org-wide platform, AI Enterprise.', goal:true} ]},

 student:{portal:'dli', goal:'Certified · hired', steps:[
   {phase:'Trigger', title:'Wants AI skills / a job', detail:'Breaking into AI engineering.'},
   {phase:'Looking', title:'YouTube tutorials', detail:'Free first exposure.', ch:'yt'},
   {phase:'Looking', title:'Reddit / Discord advice', detail:'What’s worth learning.', ch:'social'},
   {phase:'Discover', title:'Finds DLI courses', detail:'Hands-on, GPU included.'},
   {phase:'Land', title:'learn.nvidia.com', detail:'Course catalog + labs.', portal:true},
   {phase:'Try', title:'Takes a hands-on course', detail:'Real GPU, guided project.'},
   {phase:'Build', title:'Builds a portfolio project', detail:'Something to show employers.'},
   {phase:'Hurdle', title:'Is it credible to employers?', detail:'Needs a recognized signal.', friction:true},
   {phase:'Goal', title:'Certified · hired', detail:'Credential tied to real roles.', goal:true} ]},

 laptop:{portal:'market', goal:'Rig bought & running', steps:[
   {phase:'Trigger', title:'Machine can’t run local AI / games', detail:'Wants a GPU for dev / play.'},
   {phase:'Looking', title:'YouTube GPU reviews', detail:'Benchmarks + comparisons.', ch:'yt'},
   {phase:'Looking', title:'Reddit build advice + Google', detail:'Which card / laptop for the budget.', ch:'google'},
   {phase:'Looking', title:'Sees deals on social / ads', detail:'Price + availability.', ch:'social'},
   {phase:'Discover', title:'Picks an RTX GPU / laptop', detail:'Matches workload to a SKU.'},
   {phase:'Land', title:'nvidia.com / a retailer', detail:'Specs, where to buy.', portal:true},
   {phase:'Try', title:'Compares SKUs & specs', detail:'VRAM, wattage, price.'},
   {phase:'Hurdle', title:'Confusing SKU lineup', detail:'RTX vs GeForce vs workstation.', friction:true},
   {phase:'Build', title:'Buys & installs drivers', detail:'Sets up CUDA / Studio drivers.'},
   {phase:'Goal', title:'Rig bought & running', detail:'Local AI / gaming rig live.', goal:true} ]},

 dc:{portal:'market', goal:'Datacenter live', steps:[
   {phase:'Trigger', title:'Need large training/inference capacity', detail:'Scaling beyond a few GPUs.'},
   {phase:'Looking', title:'GTC + NVIDIA sales', detail:'Field engagement begins.', ch:'gtc'},
   {phase:'Discover', title:'DGX SuperPOD = turnkey cluster', detail:'Pre-engineered at data-center scale.'},
   {phase:'Land', title:'NVIDIA sales / nvidia.com', detail:'Configuration + quote.', portal:true},
   {phase:'Try', title:'LaunchPad hands-on eval', detail:'Test the stack before buying.'},
   {phase:'Build', title:'Procures SuperPOD + networking', detail:'Quantum / Spectrum fabric.'},
   {phase:'Hurdle', title:'TCO vs cloud · capex approval', detail:'Long procurement cycle.', friction:true},
   {phase:'Goal', title:'Datacenter live', detail:'Cluster behaving as one machine.', goal:true} ]},
};

/* ---------- svg helpers ---------- */
const SVGNS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const svg=document.getElementById('svg'),vp=document.getElementById('viewport');
const gA=document.getElementById('gA'),gB=document.getElementById('gB'),gC=document.getElementById('gC'),gD=document.getElementById('gD');
function clearAll(){[gA,gB,gC,gD].forEach(g=>{while(g.firstChild)g.removeChild(g.firstChild);});}
function wrap(s,max){const w=s.split(' ');const L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>max){if(c)L.push(c);c=x;}else c=(c+' '+x).trim();});if(c)L.push(c);return L;}
function block(parent,x,y,lines,cls,anchor,lh){lines.forEach((ln,i)=>{el('text',{x:x,y:y+i*(lh||13),class:cls,'text-anchor':anchor||'middle'},parent).textContent=ln;});}

let WORLD_W=1840,WORLD_H=720;
function setWorld(w,h){WORLD_W=w;WORLD_H=h;svg.setAttribute('viewBox',`0 0 ${WORLD_W} ${WORLD_H}`);}

/* =================================================================
   OVERVIEW
   ================================================================= */
function buildOverview(){
  clearAll();
  const COLX={0:360,1:650,2:1110,3:1850}, xP=58, OY=224, ROW=90, MINGAP=86;
  const yLane=o=>OY+o*ROW;

  // --- channels (col1) positioned by mean of personas using them ---
  const chMembers={}; Object.keys(CH).forEach(k=>chMembers[k]=[]);
  PERSONAS.forEach(p=>[...new Set(J[p.id].steps.filter(s=>s.ch).map(s=>s.ch))].forEach(c=>chMembers[c].push(p.id)));
  const chY={}; Object.keys(CH).forEach(k=>chY[k]=chMembers[k].length?chMembers[k].reduce((s,id)=>s+yLane(P[id].order),0)/chMembers[k].length:OY);
  (function(){const arr=Object.keys(CH).sort((a,b)=>chY[a]-chY[b]);for(let i=1;i<arr.length;i++)if(chY[arr[i]]<chY[arr[i-1]]+MINGAP)chY[arr[i]]=chY[arr[i-1]]+MINGAP;})();

  // --- portal directory (col2): fixed grouped vertical order ---
  const portalY={}; const primaryCount={};
  PERSONAS.forEach(p=>primaryCount[PRIMARY[p.id]]=(primaryCount[PRIMARY[p.id]]||0)+1);
  let yc=OY-10; const groupHdrs=[];
  L10GROUPS.forEach(g=>{ groupHdrs.push({cat:g.cat,y:yc}); yc+=42; g.portals.forEach(([id])=>{ portalY[id]=yc; yc+=62; }); yc+=12; });
  const directoryBottom=yc;

  // goals (col3) by persona order
  const goalY={}; PERSONAS.forEach(p=>goalY[p.id]=yLane(p.order));

  setWorld(2240, Math.max(directoryBottom, yLane(10))+90);

  // headers
  function hdr(x,t,cls){el('text',{x:x,y:120,class:'stageHdr '+(cls||''),'text-anchor':'middle'},gA).textContent=t;}
  hdr(xP+90,'The persona');hdr(COLX[1],'1 · Looking');hdr(COLX[2],'2 · NVIDIA portals','stageHdrHub');hdr(COLX[3],'3 · Goal');
  el('line',{x1:0,y1:150,x2:WORLD_W,y2:150,stroke:'#eee','stroke-width':1},gA);

  // category headers in the directory
  groupHdrs.forEach(h=>{ el('text',{x:COLX[2],y:h.y+4,class:'fPhase',fill:'#1f1f1f','text-anchor':'middle'},gA).textContent=h.cat.toUpperCase(); });

  const linkEls=[]; // {el, p, kind}
  function link(g,x1,y1,x2,y2,color,w,op,bow){ const c1=bow?x1+bow:(x1+x2)/2, c2=bow?x2+bow:(x1+x2)/2;
    return el('path',{d:`M ${x1} ${y1} C ${c1} ${y1} ${c2} ${y2} ${x2} ${y2}`,fill:'none',stroke:color,'stroke-width':w,opacity:op,'stroke-linecap':'round'},g); }

  // SECONDARY links first (faint, behind): primary portal -> each secondary portal
  PERSONAS.forEach(p=>{ const pr=PRIMARY[p.id], px=COLX[2], py=portalY[pr];
    SECONDARY[p.id].forEach(sec=>{ const e=link(gB,px,py,px,portalY[sec],P[p.id].color,2,0.12,-150); linkEls.push({el:e,p:p.id,kind:'sec'}); });
  });
  // MAIN links: origin -> channels -> primary portal -> goal
  PERSONAS.forEach(p=>{
    const chans=[...new Set(J[p.id].steps.filter(s=>s.ch).map(s=>s.ch))];
    const oy=yLane(p.order), pr=PRIMARY[p.id];
    chans.forEach(c=>{
      linkEls.push({el:link(gB,COLX[0],oy,COLX[1],chY[c],P[p.id].color,3.6,0.4),p:p.id,kind:'main'});
      linkEls.push({el:link(gB,COLX[1],chY[c],COLX[2],portalY[pr],P[p.id].color,3.6,0.4),p:p.id,kind:'main'});
    });
    linkEls.push({el:link(gB,COLX[2],portalY[pr],COLX[3],goalY[p.id],P[p.id].color,3.6,0.4),p:p.id,kind:'main'});
  });

  // channel nodes
  Object.keys(CH).forEach(k=>{const big=chMembers[k].length,r=big>1?12+Math.min(big,6):10;const g=el('g',{},gC);
    el('circle',{cx:COLX[1],cy:chY[k],r:r,fill:'#fff',stroke:'#222','stroke-width':3.5},g);
    if(big>=3)el('text',{x:COLX[1],y:chY[k]+8,class:'nodeBadge','text-anchor':'middle',fill:'#222'},g).textContent=big;
    el('text',{x:COLX[1],y:chY[k]-r-32,class:'nodeName','text-anchor':'middle'},g).textContent=CH[k].name;
    el('text',{x:COLX[1],y:chY[k]-r-10,class:'nodeSub','text-anchor':'middle'},g).textContent=CH[k].sub;});

  // portal nodes (directory)
  L10GROUPS.forEach(g=>g.portals.forEach(([id,nm])=>{
    const y=portalY[id], pc=primaryCount[id]||0, gnode=el('g',{},gC);
    const r = pc>0 ? 12+Math.min(pc,6) : 9;
    el('circle',{cx:COLX[2],cy:y,r:r,fill:'#fff',stroke:pc>0?'#2c4010':'#3a3a34','stroke-width':pc>0?4:3},gnode);
    if(pc>=2)el('text',{x:COLX[2],y:y+8,class:'nodeBadge','text-anchor':'middle',fill:'#2c4010'},gnode).textContent=pc;
    el('text',{x:COLX[2]+r+12,y:y+8,class:pc>0?'portalName':'nodeName','text-anchor':'start',fill:pc>0?'#2c4010':'#2a2a2a'},gnode).textContent=nm;
  }));

  // goal nodes
  PERSONAS.forEach(p=>{const y=goalY[p.id],g=el('g',{},gC);
    el('circle',{cx:COLX[3],cy:y,r:11,fill:'#fff',stroke:P[p.id].color,'stroke-width':5},g);
    el('text',{x:COLX[3]+22,y:y+8,class:'nodeName','text-anchor':'start'},g).textContent=J[p.id].goal;});

  // persona labels (click = focus; hover = emphasize that persona's whole web)
  PERSONAS.forEach(p=>{const y=yLane(p.order);
    const g=el('g',{style:'cursor:pointer'},gD); g.addEventListener('click',ev=>{ev.stopPropagation();focusOn(p.id);});
    el('rect',{x:0,y:y-28,width:COLX[1]-60,height:56,fill:'transparent'},g);
    el('circle',{cx:COLX[0],cy:y,r:6,fill:P[p.id].color},g);
    el('text',{x:xP,y:y-6,class:'pName',fill:p.color},g).textContent=p.name;
    el('text',{x:xP,y:y+20,class:'pIntent',fill:'#2f2f2a'},g).textContent='L'+p.layer+' · '+p.intent;
    g.addEventListener('mouseenter',()=>linkEls.forEach(l=>l.el.setAttribute('opacity', l.p===p.id?(l.kind==='sec'?0.7:0.95):0.04)));
    g.addEventListener('mouseleave',()=>linkEls.forEach(l=>l.el.setAttribute('opacity', l.kind==='sec'?0.12:0.4)));
  });
  initView(1.35);
}

/* =================================================================
   FOCUS — only one persona's journey, fine-grained
   ================================================================= */
function buildFocus(pid){
  clearAll();
  const p=P[pid], j=J[pid], col=p.color;
  const steps=j.steps;
  const X0=150, STEP=236, yC=440, R=14;
  const W = X0 + steps.length*STEP + 180;
  setWorld(Math.max(W,1500), 980);

  // title block
  el('text',{x:70,y:150,class:'fTitle',fill:col},gA).textContent=p.name;
  el('text',{x:70,y:196,class:'fIntent'},gA).textContent='Layer '+p.layer+' · '+p.intent;
  el('text',{x:70,y:232,class:'fHint'},gA).textContent='One journey, step by step: how they arrive, what they do, and where it snags.';

  // center spine
  const xAt=i=>X0+i*STEP;
  // draw connectors first
  for(let i=0;i<steps.length-1;i++){
    const s=steps[i], n=steps[i+1];
    const x1=xAt(i), x2=xAt(i+1);
    if(s.branch){ /* handled when drawing branch node (its outgoing) */ }
  }
  // we draw segment-by-segment, accounting for branches
  function seg(x1,y1,x2,y2,color,w,op){const mx=(x1+x2)/2;el('path',{d:`M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`,fill:'none',stroke:color||col,'stroke-width':w||5,opacity:op==null?0.9:op,'stroke-linecap':'round'},gB);}

  steps.forEach((s,i)=>{
    const x=xAt(i);
    if(s.branch){
      const offs=s.branch.map((_,k)=>(k-(s.branch.length-1)/2)*140);
      // incoming from prev center to each branch
      if(i>0) offs.forEach(o=>seg(xAt(i-1),yC,x,yC+o,col,4,0.85));
      // outgoing from each branch to next center
      if(i<steps.length-1) offs.forEach(o=>seg(x,yC+o,xAt(i+1),yC,col,4,0.85));
      s.branch.forEach((b,k)=>{
        const by=yC+offs[k];
        el('circle',{cx:x,cy:by,r:11,fill:'#fff',stroke:col,'stroke-width':4},gC);
        block(gC,x,by-30,wrap(b.title,14),'fStep','middle',26);
        block(gC,x,by+42,wrap(b.detail,17),'fDetail','middle',24);
      });
      // phase tag
      el('text',{x:x,y:yC-200,class:'fPhase',fill:'#3a3a34','text-anchor':'middle'},gC).textContent=s.phase;
      return;
    }
    // straight connector from prev (if prev not branch, else already drawn)
    if(i>0 && !steps[i-1].branch) seg(xAt(i-1),yC,x,yC,col,6,0.9);
    // node
    const goal=s.goal, fr=s.friction, portal=s.portal;
    if(goal){ const w=Math.max(wrap(s.title,16).join('').length*14+44,220);
      el('rect',{x:x-14,y:yC-24,width:w,height:48,rx:24,fill:'#161616'},gC);
      el('text',{x:x-14+w/2,y:yC+9,'text-anchor':'middle',fill:'#fff',style:'font-size:25px;font-weight:600'},gC).textContent=s.title;
    } else {
      el('circle',{cx:x,cy:yC,r:R,fill:'#fff',stroke:fr?'#c98a2a':(portal?'#2c4010':col),'stroke-width':5},gC);
      if(portal) el('circle',{cx:x,cy:yC,r:6,fill:'#2c4010'},gC);
      if(fr) el('text',{x:x,y:yC+9,'text-anchor':'middle',style:'font-size:26px;font-weight:800;fill:#c98a2a'},gC).textContent='!';
    }
    // phase tag above
    el('text',{x:x,y:yC-122,class:'fPhase',fill:portal?'#4f6f12':'#3a3a34','text-anchor':'middle'},gC).textContent=s.phase;
    // title above, detail below
    if(!goal){
      block(gC,x,yC-86,wrap(s.title,14),fr?'fFric':'fStep','middle',27);
      block(gC,x,yC+50,wrap(s.detail,17),'fDetail','middle',25);
    }
  });

  // Portals-touched strip (Layer 10) — which NVIDIA portals appear on THIS journey
  const stripY=820;
  el('text',{x:70,y:stripY,style:'font-size:22px;letter-spacing:.08em;font-weight:700;fill:#1f1f1f'},gD).textContent='NVIDIA PORTALS ON THIS JOURNEY  (LAYER 10)';
  let cx=70, cy=stripY+46; const maxX=WORLD_W-100;
  portalsOf(pid).forEach((id,i)=>{
    const nm=PORTAL_NAME[id]||id, primary=(i===0), w=nm.length*13+30;
    if(cx+w>maxX){cx=70;cy+=58;}
    const g=el('g',{},gD);
    el('rect',{x:cx,y:cy-28,width:w,height:48,rx:24,fill:primary?'#f1f7e6':'#fff',stroke:primary?'#76b900':'#9a9a8f','stroke-width':primary?2:1.4},g);
    el('text',{x:cx+16,y:cy+2,style:`font-size:23px;font-weight:${primary?700:500};fill:${primary?'#2c4010':'#2a2a2a'}`},g).textContent=nm;
    cx+=w+12;
  });
  el('text',{x:70,y:cy+48,class:'fHint'},gD).textContent='Primary front door highlighted in green · the rest are also touched (docs, code, community, partner programs).';

  resetView();
}

/* =================================================================
   mode control
   ================================================================= */
const backBtn=document.getElementById('backBtn'), subline=document.getElementById('subline'),
      h1=document.getElementById('h1'), hint=document.getElementById('hint');
function showOverview(){
  backBtn.style.display='none';
  h1.innerHTML='NVIDIA Developer <span class="accent">Journeys</span>';
  subline.style.display='';
  hint.textContent='Click a persona to open its journey · drag to pan · scroll to zoom';
  buildOverview();
}
function focusOn(pid){
  backBtn.style.display='';
  subline.style.display='none';
  h1.innerHTML='';
  hint.textContent='Single journey · ← All personas to go back · drag / scroll to explore';
  buildFocus(pid);
}
backBtn.addEventListener('click',()=>{ if(location.hash){location.hash='';} else showOverview(); });

/* =================================================================
   pan + zoom
   ================================================================= */
const stage=document.getElementById('stage');
let scale=1,tx=0,ty=0;
function apply(){vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);}
function bs(){const r=svg.getBoundingClientRect();return Math.min(r.width/WORLD_W,r.height/WORLD_H);}
function c2w(cx,cy){const r=svg.getBoundingClientRect(),s=bs();const px=(r.width-WORLD_W*s)/2,py=(r.height-WORLD_H*s)/2;const vx=(cx-r.left-px)/s,vy=(cy-r.top-py)/s;return{x:(vx-tx)/scale,y:(vy-ty)/scale,vx,vy};}
function zoomAt(cx,cy,f){const q=c2w(cx,cy);const ns=Math.max(0.6,Math.min(8,scale*f));tx=q.vx-ns*q.x;ty=q.vy-ns*q.y;scale=ns;apply();}
function resetView(){scale=1;tx=0;ty=0;apply();}
function initView(s){scale=s;tx=0;ty=0;apply();}
function cz(f){const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f);}
document.getElementById('zin').onclick=()=>cz(1.3);
document.getElementById('zout').onclick=()=>cz(0.77);
document.getElementById('zfit').onclick=resetView;
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.893);},{passive:false});
let drag=false,lx=0,ly=0,moved=0;const ptrs=new Map();let pinch=0;
stage.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1){drag=true;moved=0;lx=e.clientX;ly=e.clientY;stage.classList.add('grabbing');stage.setPointerCapture(e.pointerId);}else if(ptrs.size===2){drag=false;pinch=td();}});
stage.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const d=td(),c=tc();if(pinch)zoomAt(c.x,c.y,d/pinch);pinch=d;return;}if(drag){const s=bs();const dx=e.clientX-lx,dy=e.clientY-ly;tx+=dx/s;ty+=dy/s;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;apply();}});
function ep(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;if(ptrs.size===0){drag=false;stage.classList.remove('grabbing');}}
stage.addEventListener('pointerup',ep);stage.addEventListener('pointercancel',ep);
function td(){const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
function tc(){const a=[...ptrs.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}

function applyHash(){const id=location.hash.replace('#','');if(id&&P[id])focusOn(id);else showOverview();}
window.addEventListener('hashchange',applyHash);
applyHash();
</script>
